          { s: "If you scaled the training inputs, new inputs must be scaled the same way.", a: true, why: "Otherwise the model sees numbers on a scale it never learned." },
          { s: "It's safe to load any .pt file from the internet without weights_only.", a: false, why: "Pickled files can run code. Only load files you trust." },
        ],
      },
      ],
    },
    ];

    /* ================= Index the content ================= */
    const TYPES = ['fill', 'output', 'order', 'debug', 'tools', 'tf'];
    const TYPE_LABEL = { fill: 'fill_in', output: 'output', order: 'order', debug: 'debug', tools: 'pick_tool', tf: 'true_false' };
    const ITEMS = {};
    TRACKS.forEach(t => t.chapters.forEach((c, i) => {
      c.track = t; c.idx = i;
      TYPES.forEach(ty => (c[ty] || []).forEach((it, j) => {
        it.key = `${c.id}.${ty}.${j}`;
        ITEMS[it.key] = { type: ty, item: it, ch: c };
      }));
    }));

    const MODES = [
      { id: 'learn',  file: 'learn.md',      icon: 'learn',  title: 'Learn',              desc: 'Short lessons with real code.' },
      { id: 'fill',   file: 'fill_in.py',    icon: 'fill',   title: 'Fill in',            desc: 'Type the missing piece of code.', type: 'fill' },
      { id: 'output', file: 'output.log',    icon: 'output', title: 'Predict the output', desc: 'Read the code. What does it print?', type: 'output' },
      { id: 'order',  file: 'order.py',      icon: 'order',  title: 'Put it in order',    desc: 'Tap the lines to rebuild the program.', type: 'order' },
      { id: 'debug',  file: 'debug.py',      icon: 'debug',  title: 'Debug',              desc: 'Find the line that breaks it.', type: 'debug' },
      { id: 'tools',  file: 'pick_tool.py',  icon: 'tools',  title: 'Pick the tool',      desc: 'Choose the right function for the job.', type: 'tools' },
      { id: 'rapid',  file: 'rapid.sh',      icon: 'rapid',  title: 'Rapid fire',         desc: '60 seconds of true or false.' },
      { id: 'exam',   file: 'exam.py',       icon: 'exam',   title: 'Exam',               desc: '10 mixed questions. Pass with 80%.' },
      { id: 'sheet',  file: 'cheatsheet.md', icon: 'sheet',  title: 'Cheat sheet',        desc: 'Every snippet, searchable.' },
    ];
    const RAPID_SECONDS = 60;
    const EXAM_SIZE = 10;
    const PASS = 0.8;

    /* ================= Storage ================= */
    const Store = {
      d: null,
      load() {
        let d = {};
        try { d = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { d = {}; }
        this.d = Object.assign({
          track: 'data', chapter: {}, mode: 'learn', learnPos: {},
          lessons: {}, items: {}, best: {}, exams: {},
          streak: { day: null, count: 0 }, seenInstall: false,
          scope: { rapid: 'track', exam: 'chapter' },
          settings: { theme: null, shuffle: false },
        }, d);
        this.d.settings = Object.assign({ theme: null, shuffle: false }, this.d.settings);
        this.d.scope = Object.assign({ rapid: 'track', exam: 'chapter' }, this.d.scope);
        return this.d;
      },
      save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(this.d)); } catch (e) {} },
      mark(key, ok) { this.d.items[key] = ok ? 1 : 0; this.touchStreak(); this.save(); },
      touchStreak() {
        const today = dayKey(), y = new Date(); y.setDate(y.getDate() - 1);
        const s = this.d.streak;
        if (s.day === today) return;
        s.count = s.day === dayKey(y) ? s.count + 1 : 1;
        s.day = today;
      },
      liveStreak() {
        const s = this.d.streak, y = new Date(); y.setDate(y.getDate() - 1);
        return (s.day === dayKey() || s.day === dayKey(y)) ? s.count : 0;
      },
      setBest(key, v) { if (this.d.best[key] == null || v > this.d.best[key]) { this.d.best[key] = v; this.save(); return true; } return false; },
    };

    /* ================= App ================= */
    const app = {
      runs: {},          // one run per mode, for the current chapter
      learnI: 0,
      query: '',
      installPrompt: null,
      rapidTimer: null,

      init() {
        Store.load();
        if (!TRACKS.some(t => t.id === Store.d.track)) Store.d.track = TRACKS[0].id;
        if (!MODES.some(m => m.id === Store.d.mode)) Store.d.mode = 'learn';
        this.learnI = Store.d.learnPos[this.ch().id] || 0;
        this.applyTheme();
        document.addEventListener('click', e => this.onClick(e));
        document.addEventListener('keydown', e => this.onKey(e));
        document.addEventListener('input', e => this.onInput(e));
        this.renderAll();
        this.renderInstallBtn();
        $('#settings-btn').innerHTML = icon('sliders');
        $('#foot').innerHTML = `<span>glitch.ml v${APP_VERSION} · lessons &amp; questions written with AI</span><span class="by">made by Ahmed Hashash</span>`;
      },

      /* ---------- state ---------- */
      track() { return TRACKS.find(t => t.id === Store.d.track); },
      ch() { const t = this.track(); return t.chapters.find(c => c.id === Store.d.chapter[t.id]) || t.chapters[0]; },
      mode() { return MODES.find(m => m.id === Store.d.mode); },
      run() { return this.runs[Store.d.mode]; },
      resetRuns() { this.stopRapid(); this.runs = {}; },
      progress(c) {
        let total = 2, done = (Store.d.lessons[c.id] ? 1 : 0) + ((Store.d.exams[c.id] || 0) >= PASS ? 1 : 0);
        TYPES.forEach(t => (c[t] || []).forEach(it => { total++; if (Store.d.items[it.key] === 1) done++; }));
        return done / total;
      },
      trackProgress(t) { return t.chapters.reduce((s, c) => s + this.progress(c), 0) / t.chapters.length; },
      mistakeKeys() { return Object.keys(Store.d.items).filter(k => Store.d.items[k] === 0 && ITEMS[k]); },

      setChapter(id) {
        const t = this.track();
        Store.d.chapter[t.id] = id;
        this.learnI = Store.d.learnPos[id] || 0;
        this.resetRuns();
        Store.save();
        this.renderAll(true);
      },
      setMode(id) {
        if (Store.d.mode === 'rapid' && id !== 'rapid') { this.stopRapid(); delete this.runs.rapid; }
        Store.d.mode = id;
        Store.save();
        this.renderTabs();
        this.renderPane(true);
        this.renderStatus();
      },

      /* ---------- rendering ---------- */
      renderAll(anim) {
        this.renderStreak();
        this.renderTracks();
        this.renderCell();
        this.renderTabs();
        this.renderPane(anim);
        this.renderStatus();
      },
      renderStreak() {
        const n = Store.liveStreak();
        $('#streak').innerHTML = `${icon('pulse')}<span>${n}d</span>`;
        $('#streak').title = `${n} day${n === 1 ? '' : 's'} in a row`;
      },
      renderTracks() {
        $('#tracks').innerHTML = TRACKS.map(t => `
          <button class="track ${t.id === Store.d.track ? 'on' : ''}" data-action="track" data-id="${t.id}" aria-pressed="${t.id === Store.d.track}">
            <span class="n">${t.n}<em>${pct(this.trackProgress(t))}%</em></span>
            <b>${esc(t.name)}</b>
            <small>${esc(t.lib)}</small>
          </button>`).join('');
      },
      renderCell() {
        const t = this.track(), ch = this.ch(), i = ch.idx, p = this.progress(ch);
        const passed = (Store.d.exams[ch.id] || 0) >= PASS;
        $('#cell').innerHTML = `
          <div class="cell-gutter">In [${i + 1}]:</div>
          <div class="cell-main">
            <div class="crumb">
              <span><em class="in">In [${i + 1}]: </em><i class="full">${t.n} ${esc(t.name)} · chapter ${i + 1} of ${t.chapters.length}</i><i class="short">${i + 1} of ${t.chapters.length}</i></span>
              <button class="icon-btn" data-action="ch-prev" aria-label="Previous chapter" ${i === 0 ? 'disabled' : ''}>${icon('left')}</button>
              <button class="icon-btn" data-action="ch-next" aria-label="Next chapter" ${i === t.chapters.length - 1 ? 'disabled' : ''}>${icon('right')}</button>
              <button class="btn btn-sm" data-action="chapters">${icon('list')} Chapters</button>
            </div>
            <h1>${esc(ch.title)}</h1>
            <p>${md(ch.blurb)}</p>
            <div class="cell-out">
              <span class="lbl">Out[${i + 1}]:</span>
              <div class="bar"><i style="width:${pct(p)}%"></i></div>
              <span class="pv">${pct(p)}%</span>
              ${passed ? '<span class="pass">passed</span>' : ''}
            </div>
          </div>`;
      },
      tabBadge(m, ch) {
        if (m.id === 'learn') return Store.d.lessons[ch.id] ? `<span class="badge done">${icon('check')}</span>` : '';
        if (m.type) {
          const items = ch[m.type] || [];
          const ok = items.filter(it => Store.d.items[it.key] === 1).length;
          return `<span class="badge ${ok === items.length ? 'done' : ''}">${ok}/${items.length}</span>`;
        }
        if (m.id === 'exam') { const s = Store.d.exams[ch.id]; return s != null ? `<span class="badge ${s >= PASS ? 'done' : ''}">${pct(s)}%</span>` : ''; }
        return '';
      },
      renderTabs() {
        const ch = this.ch(), cur = Store.d.mode, tabs = $('#tabs');
        tabs.innerHTML = MODES.map(m => `
          <button class="tab ${m.id === cur ? 'on' : ''}" data-action="mode" data-mode="${m.id}" role="tab" aria-selected="${m.id === cur}" title="${esc(m.title)}">
            ${icon(m.icon)}<span>${m.file}</span>${this.tabBadge(m, ch)}
          </button>`).join('');
        const on = $('.tab.on', tabs);
        if (on && (on.offsetLeft < tabs.scrollLeft || on.offsetLeft + on.offsetWidth > tabs.scrollLeft + tabs.clientWidth)) {
          tabs.scrollLeft = on.offsetLeft - (tabs.clientWidth - on.offsetWidth) / 2;
        }
      },
      renderStatus() {
        const m = this.mode(), ch = this.ch(), r = this.run();
        let right = '';
        if (m.id === 'learn') right = this.learnI >= ch.learn.length ? 'lesson done' : `card ${this.learnI + 1}/${ch.learn.length}`;
        else if (r && (r.kind === 'practice' || r.kind === 'exam')) {
          const ok = r.results.filter(x => x.correct).length;
          right = `${Math.min(r.i + 1, r.list.length)}/${r.list.length} · <span class="ok">✓ ${ok}</span> <span class="no">✗ ${r.results.length - ok}</span>`;
        } else if (r && r.kind === 'rapid') right = `score ${r.score}`;
        else if (m.id === 'sheet') right = `${ch.learn.filter(c => c.code).length} snippets`;
        $('#status').innerHTML = `<span class="live"><i></i>${esc(this.track().lib)}</span><span>${esc(ch.file)}</span><span class="sp"></span><span>${right}</span>`;
      },
      renderPane(anim) {
        const m = this.mode(), pane = $('#pane');
        let h = `<div class="ptitle"><b>${esc(m.title)}</b><span>${esc(m.desc)}</span></div>`;
        if (m.id === 'learn') h += this.viewLearn();
        else if (m.type) h += this.viewPractice(m);
        else if (m.id === 'rapid') h += this.viewRapid();
        else if (m.id === 'exam') h += this.viewExam();
        else if (m.id === 'sheet') h += this.viewSheet();
        pane.classList.toggle('anim', !!anim);
        pane.innerHTML = h;
        this.afterRender();
      },
      afterRender() {
        const r = this.run(), q = r && r.q;
        const blank = $('#blank');
        if (blank && q && !q.answered && isDesktop()) blank.focus({ preventScroll: true });
        if (q && q.answered && isDesktop()) { const n = $('#next-btn'); if (n) n.focus({ preventScroll: true }); }
        if (r && r.kind === 'rapid' && r.live) this.startRapidBar();
      },
      refreshProgress() {
        this.renderStreak();
        this.renderTracks();
        this.renderCell();
        this.renderTabs();
        this.renderStatus();
      },
      // Keep the question in view after it changes (on phones the pane is long).
      scrollPaneIntoView() {
        const r = $('#tabs').getBoundingClientRect();
        if (r.top < 0) window.scrollTo({ top: window.scrollY + r.top - 8, behavior: 'smooth' });
      },

      /* ---------- Learn ---------- */
      viewLearn() {
        const ch = this.ch(), cards = ch.learn, n = cards.length;
        if (this.learnI >= n) {
          const short = ['fill', 'output', 'order', 'debug', 'tools', 'exam'].map(id => MODES.find(m => m.id === id));
          return `
            <div class="center intro">
              <div class="big-icon ok">${icon('check')}</div>
              <h2>Lesson complete</h2>
              <p>Now practise it. Start with <code>fill_in</code>, or take the exam if you feel ready.</p>
              <div class="shortcuts">${short.map(m => `<button class="shortcut" data-action="mode" data-mode="${m.id}">${icon(m.icon)}${m.file}</button>`).join('')}</div>
              <div class="actions" style="justify-content:center"><button class="btn btn-ghost btn-sm" data-action="learn-goto" data-i="0">${icon('restart')} Read it again</button></div>
            </div>`;
        }
        const c = cards[this.learnI], i = this.learnI;
        return `
          <div class="lesson">
            <div class="lesson-top">
              <span class="step">CARD ${String(i + 1).padStart(2, '0')} / ${String(n).padStart(2, '0')}</span>
              <div class="dnav">${cards.map((_, k) => `<button class="${k === i ? 'on' : k < i ? 'seen' : ''}" data-action="learn-goto" data-i="${k}" aria-label="Card ${k + 1}"><i></i></button>`).join('')}</div>
            </div>
            <h2>${md(c.h)}</h2>
            ${c.p ? `<p>${md(c.p)}</p>` : ''}
            ${c.code ? codeBlock(c.code, { file: ch.file, copy: true }) : ''}
            ${c.out ? term(c.out) : ''}
            ${c.tip ? `<div class="tip">${icon('bulb')}<span>${md(c.tip)}</span></div>` : ''}
            <div class="actions">
              <button class="btn btn-ghost" data-action="learn-prev" ${i === 0 ? 'disabled' : ''}>${icon('left')} Back</button>
              <span class="sp"></span>
              ${i === n - 1
                ? `<button class="btn btn-primary" data-action="learn-done">${icon('check')} Finish lesson</button>`
                : `<button class="btn btn-primary" data-action="learn-next">Next ${icon('right')}</button>`}
            </div>
          </div>`;
      },
      learnGo(i) {
        const n = this.ch().learn.length;
        this.learnI = Math.max(0, Math.min(n, i));
        Store.d.learnPos[this.ch().id] = Math.min(this.learnI, n - 1);
        Store.save();
        this.renderPane(true);
        this.renderStatus();
        this.scrollPaneIntoView();
      },

      /* ---------- Practice runs (and exam questions) ---------- */
      newQ(key) {
        const { type, item } = ITEMS[key];
        const q = { key, type, answered: false, correct: null };
        if (type === 'output' || type === 'tools') q.perm = shuffle(item.o.map((_, i) => i));
        if (type === 'fill') { q.value = ''; q.hint = false; }
        if (type === 'debug') q.sel = null;
        if (type === 'order') {
          const valid = this.orderValids(item);
          let pool, tries = 0;
          do { pool = shuffle(item.lines.map((_, i) => i)); }
          while (item.lines.length > 2 && valid.some(v => v.every((l, k) => item.lines[pool[k]] === l)) && ++tries < 30);
          q.pool = pool; q.placed = [];
        }
        return q;
      },
      startPractice(type, keys, label) {
        const ch = this.ch();
        let list = keys || (ch[type] || []).map(it => it.key);
        if (!keys && Store.d.settings.shuffle) list = shuffle(list);
        const run = { kind: 'practice', mode: Store.d.mode, type, label, list, i: 0, results: [], q: null };
        run.q = list.length ? this.newQ(list[0]) : null;
        this.runs[Store.d.mode] = run;
        return run;
      },
      viewPractice(m) {
        let r = this.run();
        if (!r) r = this.startPractice(m.type);
        if (!r.list.length) return `<div class="empty">Nothing here yet.</div>`;
        if (r.i >= r.list.length) return this.viewSummary(r);
        return this.viewQuestion(r);
      },
      viewQuestion(r) {
        const q = r.q, { item } = ITEMS[q.key];
        const head = `<div class="qhead">${r.kind === 'exam' || r.label ? `<span class="tag">${r.kind === 'exam' ? TYPE_LABEL[q.type] : esc(r.label)}</span>` : ''}<div class="bar"><i style="width:${pct(r.i / r.list.length)}%"></i></div><span>${r.i + 1}/${r.list.length}</span></div>`;
        let body = '';
        if (q.type === 'fill') body = this.viewFill(item, q);
        else if (q.type === 'output' || q.type === 'tools') body = this.viewChoice(item, q);
        else if (q.type === 'debug') body = this.viewDebug(item, q);
        else if (q.type === 'order') body = this.viewOrder(item, q);
        else if (q.type === 'tf') body = this.viewTF(item, q);
        return head + body;
      },
      fb(ok, title, html) {
        return `<div class="fb ${ok ? 'ok' : 'bad'}"><div class="t">${icon(ok ? 'check' : 'x')} ${title}</div>${html}</div>`;
      },
      nextBtn() {
        const r = this.run(), last = r.i >= r.list.length - 1;
        return `<div class="actions"><span class="sp"></span><button class="btn btn-primary" id="next-btn" data-action="next">${last ? 'See results' : 'Next'} ${icon('right')}<span class="kbd">↵</span></button></div>`;
      },

      viewFill(it, q) {
        const w = Math.max(4, ...it.a.map(a => a.length)) + 1;
        const st = q.answered ? (q.correct ? 'ok' : 'no') : '';
        const blank = `<input class="blank ${st}" id="blank" value="${esc(q.value)}" style="width:calc(${w}ch + 12px)" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Missing code" ${q.answered ? 'readonly tabindex="-1"' : ''}>`;
        let h = `<p class="ask">Type the missing code.</p>` + codeBlock(it.code, { file: this.ch().file, blank });
        if (!q.answered) {
          if (q.hint) h += `<div class="hint">${icon('bulb')}<span>Starts with <code>${esc(it.a[0][0])}</code> · ${it.a[0].length} character${it.a[0].length === 1 ? '' : 's'}</span></div>`;
          h += `<div class="actions">
                  <button class="btn btn-ghost btn-sm" data-action="hint" ${q.hint ? 'disabled' : ''}>${icon('bulb')} Hint</button>
                  <button class="btn btn-ghost btn-sm" data-action="reveal">Show answer</button>
                  <span class="sp"></span>
                  <button class="btn btn-primary" data-action="check">Check <span class="kbd">↵</span></button>
                </div>`;
        } else {
          const ans = q.correct ? '' : `<p>Answer: <code>${esc(it.a[0])}</code>${q.note ? ` · ${esc(q.note)}` : ''}</p>`;
          h += this.fb(q.correct, q.correct ? 'Correct' : q.revealed ? 'Answer' : 'Not quite', `${ans}<p>${md(it.why)}</p>`) + this.nextBtn();
        }
        return h;
      },
      checkFill() {
        const q = this.run().q, it = ITEMS[q.key].item, inp = $('#blank');
        const v = inp ? inp.value : q.value;
        if (!v.trim()) { if (inp) { inp.focus(); this.shake(inp); } return; }
        const n = s => s.trim().replace(/\s+/g, '').replace(/'/g, '"');
        const ok = it.a.some(a => n(a) === n(v));
        let note = '';
        if (!ok) {
          const lo = s => n(s).toLowerCase(), uq = s => n(s).replace(/"/g, '');
          if (it.a.some(a => lo(a) === lo(v))) note = 'so close: Python is case-sensitive';
          else if (it.a.some(a => n(a) + '()' === n(v))) note = 'the brackets were already there';
          else if (it.a.some(a => uq(a) === uq(v))) note = 'check the quotes';
        }
        q.value = v;
        this.answer(ok, { note });
      },

      viewChoice(it, q) {
        const isOut = q.type === 'output';
        let h = isOut
          ? `<p class="ask">${md(it.q || 'What does this print?')}</p>` + codeBlock(it.code, { file: this.ch().file })
          : `<p class="ask">${md(it.q)}</p>`;
        h += `<div class="opts">` + q.perm.map((oi, k) => {
          let cls = '';
          if (q.answered) cls = oi === it.a ? 'right' : oi === q.pick ? 'wrong' : 'dim';
          return `<button class="opt ${cls}${it.prose ? ' prose' : ''}" data-action="opt" data-i="${oi}" ${q.answered ? 'disabled' : ''}><span class="k">${k + 1}</span><pre>${esc(it.o[oi])}</pre></button>`;
        }).join('') + `</div>`;
        if (q.answered) {
          if (isOut) h += term(it.out || it.o[it.a], 'actual output');
          h += this.fb(q.correct, q.correct ? 'Correct' : 'Not quite', `<p>${md(it.why)}</p>`) + this.nextBtn();
        }
        return h;
      },
      choose(oi) {
        const q = this.run().q;
        if (!q || q.answered) return;
        this.answer(oi === ITEMS[q.key].item.a, { pick: oi });
      },

      viewTF(it, q) {
        const btn = (v, label, cls) => {
          let st = '';
          if (q.answered) st = v === it.a ? 'right' : v === q.pick ? 'wrong' : '';
          return `<button class="btn ${cls} ${st}" data-action="tf" data-v="${v ? 1 : 0}" ${q.answered ? 'disabled' : ''}>${label}</button>`;
        };
        let h = `<p class="ask">True or false?</p><div class="stmt">${md(it.s)}</div><div class="tf">${btn(true, 'True', 'yes')}${btn(false, 'False', 'nope')}</div>`;
        if (q.answered) h += this.fb(q.correct, q.correct ? 'Correct' : `It's ${it.a ? 'true' : 'false'}`, `<p>${md(it.why)}</p>`) + this.nextBtn();
        return h;
      },

      viewDebug(it, q) {
        const bad = [].concat(it.line).map(n => n - 1);
        const cls = i => q.answered ? (bad.includes(i) ? 'good' : i === q.sel ? 'wrong' : '') : (i === q.sel ? 'sel' : '');
        let h = `<p class="ask">${md(it.task)}</p><p class="sub">${q.answered ? 'The bug is highlighted.' : 'Tap the line with the bug.'}</p>`
          + codeBlock(it.code, { file: this.ch().file, pick: q.answered ? null : 'pick-line', cls });
        if (!q.answered) {
          h += `<div class="actions"><span class="sp"></span><button class="btn btn-primary" data-action="check" ${q.sel == null ? 'disabled' : ''}>That's the bug <span class="kbd">↵</span></button></div>`;
        } else {
          const old = it.code.split('\n')[bad[0]];
          const diff = `<div class="diff">${codeHead('fix.diff')}<div class="d-body">
              <div class="d-del"><span class="sg">-</span><span>${hl(old)}</span></div>
              ${it.fix.split('\n').map(l => `<div class="d-add"><span class="sg">+</span><span>${hl(l)}</span></div>`).join('')}
            </div></div>`;
          h += diff + this.fb(q.correct, q.correct ? 'Found it' : `It's line ${bad.map(b => b + 1).join(' or ')}`, `<p>${md(it.why)}</p>`) + this.nextBtn();
        }
        return h;
      },
      checkDebug() {
        const q = this.run().q, it = ITEMS[q.key].item;
        if (q.sel == null) return;
        this.answer([].concat(it.line).includes(q.sel + 1));
      },

      orderValids(it) { return [it.lines, ...(it.alts || []).map(o => o.map(i => it.lines[i]))]; },
      viewOrder(it, q) {
        const total = it.lines.length;
        const rows = q.placed.map((li, k) => {
          const mark = q.answered ? (q.marks[k] ? 'good' : 'wrong') : '';
          const act = q.answered ? '' : ` data-action="unplace" data-n="${k}" role="button" tabindex="0" title="Tap to send it back"`;
          return `<div class="ln ${mark}"${act}><span class="no">${k + 1}</span><span class="tx">${hl(it.lines[li])}</span></div>`;
        });
        if (!q.answered && q.placed.length < total) rows.push(`<div class="ln ph"><span class="no">${q.placed.length + 1}</span><span class="tx">${q.placed.length ? '▍' : '▍ tap the lines below, in order'}</span></div>`);
        let h = `<p class="ask">${md(it.task)}</p>
          <div class="code pickable">${codeHead(this.ch().file)}<div class="code-body"><div class="lines">${rows.join('')}</div></div></div>`;
        if (!q.answered) {
          const left = q.pool.filter(i => !q.placed.includes(i));
          if (left.length) h += `<div class="pool-label">Lines</div><div class="pool">${left.map(i => `<button class="piece" data-action="piece" data-i="${i}">${hl(it.lines[i])}</button>`).join('')}</div>`;
          h += `<div class="actions">
                  <button class="btn btn-ghost btn-sm" data-action="order-reset" ${q.placed.length ? '' : 'disabled'}>${icon('restart')} Reset</button>
                  <span class="sp"></span>
                  <button class="btn btn-primary" data-action="check" ${q.placed.length === total ? '' : 'disabled'}>Check <span class="kbd">↵</span></button>
                </div>`;
        } else {
          h += this.fb(q.correct, q.correct ? 'Runs perfectly' : 'Not in the right order',
            (q.correct ? '' : `<p>One correct order:</p>`) + (it.why ? `<p>${md(it.why)}</p>` : ''));
          if (!q.correct) h += codeBlock(it.lines.join('\n'), { file: 'solution.py' });
          h += this.nextBtn();
        }
        return h;
      },
      checkOrder() {
        const q = this.run().q, it = ITEMS[q.key].item;
        if (q.placed.length !== it.lines.length) return;
        const user = q.placed.map(i => it.lines[i]);
        let best = null, bestN = -1;
        for (const v of this.orderValids(it)) {
          const marks = v.map((l, k) => user[k] === l);
          const n = marks.filter(Boolean).length;
          if (n > bestN) { bestN = n; best = marks; }
        }
        this.answer(bestN === it.lines.length, { marks: best });
      },

      answer(correct, extra = {}) {
        const r = this.run(), q = r.q;
        if (q.answered) return;
        Object.assign(q, extra, { answered: true, correct });
        Store.mark(q.key, correct);
        r.results.push({ key: q.key, correct });
        this.renderPane();
        this.refreshProgress();
      },
      next() {
        const r = this.run();
        if (!r || !r.q || !r.q.answered) return;
        r.i++;
        if (r.i < r.list.length) r.q = this.newQ(r.list[r.i]);
        else { r.q = null; this.finishRun(r); }
        this.renderPane(true);
        this.renderStatus();
        this.scrollPaneIntoView();
      },
      finishRun(r) {
        const ok = r.results.filter(x => x.correct).length, n = r.results.length;
        r.score = n ? ok / n : 0;
        const ch = this.ch();
        if (r.kind === 'practice' && !r.label) r.newBest = Store.setBest(`${ch.id}.${r.type}`, r.score);
        if (r.kind === 'exam') {
          if (r.scope === 'chapter') {
            const prev = Store.d.exams[ch.id];
            r.newBest = prev == null || r.score > prev;
            if (r.newBest) Store.d.exams[ch.id] = r.score;
          } else if (r.scope === 'track') r.newBest = Store.setBest(`exam.${this.track().id}`, r.score);
          Store.save();
        }
        this.refreshProgress();
      },
      reviewList(keys) {
        if (!keys.length) return '';
        return `<div class="review"><h3>Review</h3>${keys.map(k => {
          const { type, item } = ITEMS[k];
          let title = '', ans = '';
          if (type === 'fill') { title = `<code>${esc(item.code.split('\n').find(l => l.includes('{?}')).replace('{?}', '____').replace(/\s+#.*$/, '').trim())}</code>`; ans = item.a[0]; }
          else if (type === 'output') { title = `What does <code>${esc(item.code.split('\n').filter(l => l.trim() && !l.trim().startsWith('#')).pop())}</code> ${item.q ? 'do' : 'print'}?`; ans = item.o[item.a]; }
          else if (type === 'tools') { title = md(item.q); ans = item.o[item.a]; }
          else if (type === 'debug') { title = md(item.task); ans = item.fix; }
          else if (type === 'order') { title = md(item.task); ans = item.lines.join('\n'); }
          else if (type === 'tf') { title = md(item.s); ans = item.a ? 'True' : 'False'; }
          return `<div class="rv"><div class="rt"><span class="tag">${TYPE_LABEL[type]}</span><span>${title}</span></div>
            ${ans ? `<div class="ra">Answer: <b><code>${esc(ans)}</code></b></div>` : ''}
            ${item.why ? `<div class="rw">${md(item.why)}</div>` : ''}</div>`;
        }).join('')}</div>`;
      },
      viewSummary(r) {
        const ok = r.results.filter(x => x.correct).length, n = r.results.length;
        const wrong = r.results.filter(x => !x.correct).map(x => x.key);
        const m = this.mode();
        if (r.kind === 'exam') return this.viewExamResult(r, ok, n, wrong);
        const idx = MODES.findIndex(x => x.id === m.id);
        const nextMode = MODES[idx + 1];
        const bestKey = `${this.ch().id}.${r.type}`;
        return `
          <div class="result">
            <div class="metric">accuracy</div>
            <div class="score-big">${(n ? ok / n : 0).toFixed(2)}</div>
            <div class="score-line">${ok} of ${n} correct${!r.label && Store.d.best[bestKey] != null ? ` · best ${pct(Store.d.best[bestKey])}%` : ''}${r.newBest && n ? ' · new best' : ''}</div>
          </div>
          ${this.reviewList(wrong)}
          <div class="actions">
            ${wrong.length ? `<button class="btn btn-primary" data-action="retry-wrong">${icon('target')} Retry the ${wrong.length} you missed</button>` : ''}
            <button class="btn ${wrong.length ? '' : 'btn-primary'}" data-action="again">${icon('restart')} Again</button>
            <span class="sp"></span>
            ${nextMode ? `<button class="btn btn-ghost" data-action="mode" data-mode="${nextMode.id}">${nextMode.file} ${icon('right')}</button>` : ''}
          </div>`;
      },

      /* ---------- Exam ---------- */
      buildExam(scope) {
        if (scope === 'mistakes') return shuffle(this.mistakeKeys()).slice(0, EXAM_SIZE);
        const chs = scope === 'track' ? this.track().chapters : [this.ch()];
        const pool = chs.flatMap(c => TYPES.flatMap(t => (c[t] || []).map(it => it.key)));
        const want = { fill: 2, output: 2, tools: 2, debug: 1, order: 1, tf: 2 };
        const picks = [];
        for (const [t, n] of Object.entries(want)) picks.push(...shuffle(pool.filter(k => ITEMS[k].type === t)).slice(0, n));
        const rest = shuffle(pool.filter(k => !picks.includes(k)));
        while (picks.length < EXAM_SIZE && rest.length) picks.push(rest.pop());
        return shuffle(picks);
      },
      viewExam() {
        const r = this.runs.exam;
        if (r) return r.i >= r.list.length ? this.viewSummary(r) : this.viewQuestion(r);
        const sc = Store.d.scope.exam, ch = this.ch(), t = this.track();
        const nm = this.mistakeKeys().length;
        const best = sc === 'chapter' ? Store.d.exams[ch.id] : sc === 'track' ? Store.d.best[`exam.${t.id}`] : null;
        const scopes = [['chapter', 'This chapter'], ['track', `Whole ${t.name.toLowerCase()} track`], ['mistakes', `My mistakes (${nm})`]];
        return `
          <div class="center intro">
            <div class="big-icon">${icon('exam')}</div>
            <h2>${sc === 'mistakes' ? 'Mistakes exam' : sc === 'track' ? `${esc(t.name)} track exam` : `Exam: ${esc(ch.title)}`}</h2>
            <p>${sc === 'mistakes'
              ? 'Questions you got wrong before, from every chapter. Get them right and they leave this list.'
              : `${EXAM_SIZE} mixed questions: fill-ins, outputs, bugs, tools and true/false.${sc === 'chapter' ? ` Score ${pct(PASS)}% to mark the chapter as passed.` : ''}`}</p>
            <div class="seg">${scopes.map(([id, label]) => `<button class="${sc === id ? 'on' : ''}" data-action="exam-scope" data-scope="${id}" ${id === 'mistakes' && !nm ? 'disabled' : ''}>${label}</button>`).join('')}</div>
            <p class="small" style="color:var(--text-3)">${best != null ? `Best so far: ${pct(best)}%` : '&nbsp;'}</p>
            <div class="actions" style="justify-content:center"><button class="btn btn-primary btn-lg" data-action="exam-start" ${sc === 'mistakes' && !nm ? 'disabled' : ''}>${icon('exam')} Start</button></div>
          </div>`;
      },
      startExam() {
        const sc = Store.d.scope.exam;
        const list = this.buildExam(sc);
        if (!list.length) return this.toast('No questions to ask yet');
        this.runs.exam = { kind: 'exam', mode: 'exam', scope: sc, list, i: 0, results: [], q: this.newQ(list[0]) };
        this.renderPane(true);
        this.renderStatus();
      },
      viewExamResult(r, ok, n, wrong) {
        const score = n ? ok / n : 0, passed = score >= PASS;
        const types = TYPES.filter(t => r.results.some(x => ITEMS[x.key].type === t));
        const t = this.track(), ch = this.ch(), nextCh = t.chapters[ch.idx + 1];
        return `
          <div class="result">
            <div class="metric">validation accuracy</div>
            <div class="score-big">${score.toFixed(2)}</div>
            <div class="score-line">${ok} of ${n} correct${r.newBest ? ' · new best' : ''}</div>
            ${r.scope !== 'mistakes' ? `<span class="verdict ${passed ? 'ok' : 'no'}">${passed ? (r.scope === 'chapter' ? 'Chapter passed' : 'Passed') : `${pct(PASS)}% needed to pass`}</span>` : ''}
            <div class="breakdown">${types.map(ty => {
              const rs = r.results.filter(x => ITEMS[x.key].type === ty), g = rs.filter(x => x.correct).length;
              return `<div class="brow"><span>${TYPE_LABEL[ty]}</span><div class="bar"><i style="width:${pct(g / rs.length)}%"></i></div><span class="v">${g}/${rs.length}</span></div>`;
            }).join('')}</div>
          </div>
          ${this.reviewList(wrong)}
          <div class="actions">
            <button class="btn ${passed && nextCh && r.scope === 'chapter' ? '' : 'btn-primary'}" data-action="exam-new">${icon('restart')} New exam</button>
            <span class="sp"></span>
            ${passed && nextCh && r.scope === 'chapter' ? `<button class="btn btn-primary" data-action="chapter" data-id="${nextCh.id}" data-learn="1">Next chapter ${icon('right')}</button>` : ''}
          </div>`;
      },

      /* ---------- Rapid fire ---------- */
      rapidPool(sc) {
        const chs = sc === 'chapter' ? [this.ch()] : sc === 'track' ? this.track().chapters : TRACKS.flatMap(t => t.chapters);
        return chs.flatMap(c => (c.tf || []).map(it => it.key));
      },
      rapidBestKey(sc) { return sc === 'chapter' ? `rapid.ch.${this.ch().id}` : sc === 'track' ? `rapid.tr.${this.track().id}` : 'rapid.all'; },
      viewRapid() {
        const r = this.runs.rapid;
        if (r && r.live) {
          const left = Math.max(0, Math.ceil((r.end - Date.now()) / 1000));
          const it = ITEMS[r.list[r.i % r.list.length]].item;
          return `
            <div class="rapid-top"><span class="clock" id="rclock">${this.clock(left)}</span><div class="timer"><i id="tbar" style="width:${(r.end - Date.now()) / (RAPID_SECONDS * 10)}%"></i></div><span class="score" id="rscore">${r.score}</span></div>
            <div class="stmt" id="stmt"><span id="stmt-text">${md(it.s)}</span></div>
            <div class="combo" id="combo"></div>
            <div class="tf">
              <button class="btn yes" data-action="rapid-ans" data-v="1">True <span class="kbd">T</span></button>
              <button class="btn nope" data-action="rapid-ans" data-v="0">False <span class="kbd">F</span></button>
            </div>`;
        }
        if (r && !r.live) {
          const wrong = [...new Set(r.wrong)];
          const best = Store.d.best[r.bestKey];
          return `
            <div class="result">
              <div class="metric">score</div>
              <div class="score-big">${r.score}</div>
              <div class="score-line">${r.answered} answered · ${r.answered ? pct(r.score / r.answered) : 0}% right · best ${best ?? r.score}${r.newBest ? ' · new best' : ''}</div>
            </div>
            ${this.reviewList(wrong)}
            <div class="actions">
              <button class="btn btn-primary" data-action="rapid-start">${icon('restart')} Play again</button>
              <span class="sp"></span>
              <button class="btn btn-ghost" data-action="rapid-reset">Change scope</button>
            </div>`;
        }
        const sc = Store.d.scope.rapid, t = this.track();
        const best = Store.d.best[this.rapidBestKey(sc)];
        const scopes = [['chapter', 'This chapter'], ['track', `${t.name} track`], ['all', 'Everything']];
        return `
          <div class="center intro">
            <div class="big-icon">${icon('rapid')}</div>
            <h2>${RAPID_SECONDS} seconds. True or false?</h2>
            <p>Answer as many as you can. Use the buttons, or <b>T</b> / <b>F</b> on a keyboard. Mistakes are explained at the end.</p>
            <div class="seg">${scopes.map(([id, label]) => `<button class="${sc === id ? 'on' : ''}" data-action="rapid-scope" data-scope="${id}">${label}</button>`).join('')}</div>
            <p class="small" style="color:var(--text-3)">${this.rapidPool(sc).length} statements${best != null ? ` · best ${best}` : ''}</p>
            <div class="actions" style="justify-content:center"><button class="btn btn-primary btn-lg" data-action="rapid-start">${icon('rapid')} Start</button></div>
          </div>`;
      },
      clock(s) { return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; },
      startRapid() {
        this.stopRapid();
        const sc = Store.d.scope.rapid;
        const r = { kind: 'rapid', mode: 'rapid', scope: sc, bestKey: this.rapidBestKey(sc), list: shuffle(this.rapidPool(sc)), i: 0, score: 0, answered: 0, combo: 0, wrong: [], live: true, end: Date.now() + RAPID_SECONDS * 1000 };
        this.runs.rapid = r;
        this.renderPane(true);
        this.renderStatus();
        this.rapidTimer = setInterval(() => {
          const left = Math.max(0, Math.ceil((r.end - Date.now()) / 1000));
          const c = $('#rclock'); if (c) c.textContent = this.clock(left);
          if (Date.now() >= r.end) this.endRapid();
        }, 200);
      },
      startRapidBar() {
        const r = this.runs.rapid, bar = $('#tbar');
        if (!bar) return;
        const ms = Math.max(0, r.end - Date.now());
        bar.style.transition = 'none';
        bar.style.width = `${(ms / (RAPID_SECONDS * 1000)) * 100}%`;
        bar.getBoundingClientRect();
        bar.style.transition = `width ${ms}ms linear`;
        bar.style.width = '0%';
      },
      stopRapid() { if (this.rapidTimer) { clearInterval(this.rapidTimer); this.rapidTimer = null; } },
      endRapid() {
        const r = this.runs.rapid;
        this.stopRapid();
        if (!r || !r.live) return;
        r.live = false;
        r.newBest = Store.setBest(r.bestKey, r.score);
        if (Store.d.mode === 'rapid') { this.renderPane(true); this.refreshProgress(); }
      },
      rapidAnswer(v) {
        const r = this.runs.rapid;
        if (!r || !r.live || Date.now() >= r.end) return;
        const key = r.list[r.i % r.list.length], ok = ITEMS[key].item.a === v;
        r.answered++;
        if (ok) { r.score++; r.combo++; } else { r.combo = 0; r.wrong.push(key); }
        Store.mark(key, ok);
        r.i++;
        if (r.i % r.list.length === 0) r.list = shuffle(r.list);
        const st = $('#stmt');
        st.classList.remove('flash-ok', 'flash-bad');
        void st.offsetWidth;
        st.classList.add(ok ? 'flash-ok' : 'flash-bad');
        $('#stmt-text').innerHTML = md(ITEMS[r.list[r.i % r.list.length]].item.s);
        $('#rscore').textContent = r.score;
        $('#combo').textContent = r.combo >= 3 ? `${r.combo} in a row` : '';
        this.renderStatus();
      },

      /* ---------- Cheat sheet ---------- */
      viewSheet() {
        return `
          <label class="search">${icon('search')}<input id="sheet-q" type="search" placeholder="Search every snippet, e.g. fit_transform" value="${esc(this.query)}" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
          <div id="sheet-results">${this.sheetResults()}</div>`;
      },
      sheetResults() {
        const q = this.query.trim().toLowerCase();
        const ch = this.ch();
        let hits;
        if (!q) hits = ch.learn.map((c, i) => ({ c, i, ch })).filter(x => x.c.code);
        else hits = TRACKS.flatMap(t => t.chapters.flatMap(c => c.learn.map((card, i) => ({ c: card, i, ch: c }))))
          .filter(x => x.c.code && [x.c.h, x.c.p, x.c.code, x.ch.title].join('\n').toLowerCase().includes(q)).slice(0, 40);
        if (!hits.length) return `<div class="empty">Nothing matches “${esc(this.query)}”.</div>`;
        return hits.map(x => `
          <div class="snip">
            <h4>${md(x.c.h)}${q ? `<small>${esc(x.ch.track.name)} · ${esc(x.ch.title)}</small>` : ''}<button class="open" data-action="goto-lesson" data-ch="${x.ch.id}" data-i="${x.i}">open lesson →</button></h4>
            ${codeBlock(x.c.code, { file: x.ch.file, copy: true })}
            ${x.c.out ? term(x.c.out) : ''}
          </div>`).join('');
      },

      /* ---------- Events ---------- */
      onInput(e) {
        if (e.target.id === 'blank') { const r = this.run(); if (r && r.q) r.q.value = e.target.value; }
        if (e.target.id === 'sheet-q') { this.query = e.target.value; $('#sheet-results').innerHTML = this.sheetResults(); }
      },
      onClick(e) {
        const el = e.target.closest('[data-action]');
        if (!el || el.disabled) return;
        const fn = this.actions[el.dataset.action];
        if (fn) fn.call(this, el, e);
      },
      onKey(e) {
        const open = !!$('#overlay').innerHTML;
        if (e.key === 'Escape' && open) return this.closeSheet();
        if (open || e.metaKey || e.ctrlKey || e.altKey) return;
        const tag = (e.target.tagName || '').toLowerCase();
        if (e.target.id === 'blank') {
          if (e.key === 'Enter') { e.preventDefault(); const q = this.run() && this.run().q; if (q && !q.answered) this.checkFill(); else this.next(); }
          return;
        }
        if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.ln[data-action]')) { e.preventDefault(); e.target.click(); return; }
        if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
        if (tag === 'button' && (e.key === 'Enter' || e.key === ' ')) return;
        const m = Store.d.mode, r = this.run();
        if (m === 'learn') {
          if (e.key === 'ArrowRight') this.learnGo(this.learnI + 1);
          if (e.key === 'ArrowLeft' && this.learnI > 0) this.learnGo(this.learnI - 1);
          return;
        }
        if (r && r.kind === 'rapid') {
          if (r.live && (e.key === 't' || e.key === 'T')) this.rapidAnswer(true);
          if (r.live && (e.key === 'f' || e.key === 'F')) this.rapidAnswer(false);
          return;
        }
        const q = r && r.q;
        if (!q) return;
        if (q.answered) { if (e.key === 'Enter') { e.preventDefault(); this.next(); } return; }
        if ((q.type === 'output' || q.type === 'tools') && /^[1-9]$/.test(e.key)) { const oi = q.perm[+e.key - 1]; if (oi != null) this.choose(oi); }
        if (q.type === 'tf') {
          if (e.key === 't' || e.key === 'T' || e.key === '1') this.answer(ITEMS[q.key].item.a === true, { pick: true });
          if (e.key === 'f' || e.key === 'F' || e.key === '2') this.answer(ITEMS[q.key].item.a === false, { pick: false });
        }
        if (e.key === 'Enter' && q.type === 'debug') this.checkDebug();
        if (e.key === 'Enter' && q.type === 'order') this.checkOrder();
      },

      actions: {
        track(el) {
          if (Store.d.track === el.dataset.id) return;
          Store.d.track = el.dataset.id;
          this.learnI = Store.d.learnPos[this.ch().id] || 0;
          this.resetRuns();
          Store.save();
          this.renderAll(true);
        },
        chapter(el) {
          this.closeSheet();
          if (el.dataset.learn) Store.d.mode = 'learn';
          this.setChapter(el.dataset.id);
          if (el.dataset.learn) { this.learnI = 0; this.renderPane(true); this.renderStatus(); this.scrollPaneIntoView(); }
        },
        'ch-prev'() { const c = this.ch(); if (c.idx > 0) this.setChapter(this.track().chapters[c.idx - 1].id); },
        'ch-next'() { const c = this.ch(), t = this.track(); if (c.idx < t.chapters.length - 1) this.setChapter(t.chapters[c.idx + 1].id); },
        chapters() { this.openChapters(); },
        mode(el) { this.setMode(el.dataset.mode); if (el.classList.contains('shortcut') || el.closest('.actions')) this.scrollPaneIntoView(); },

        'learn-prev'() { this.learnGo(this.learnI - 1); },
        'learn-next'() { this.learnGo(this.learnI + 1); },
        'learn-goto'(el) { this.learnGo(+el.dataset.i); },
        'learn-done'() {
          Store.d.lessons[this.ch().id] = true;
          Store.touchStreak();
          Store.save();
          this.learnGo(this.ch().learn.length);
          this.refreshProgress();
        },

        check() {
          const q = this.run() && this.run().q;
          if (!q || q.answered) return;
          if (q.type === 'fill') this.checkFill();
          if (q.type === 'debug') this.checkDebug();
          if (q.type === 'order') this.checkOrder();
        },
        hint() { const q = this.run().q; q.hint = true; const b = $('#blank'); if (b) q.value = b.value; this.renderPane(); const nb = $('#blank'); if (nb) nb.focus(); },
        reveal() { const q = this.run().q; const b = $('#blank'); if (b) q.value = b.value; this.answer(false, { revealed: true }); },
        opt(el) { this.choose(+el.dataset.i); },
        tf(el) { const q = this.run().q; if (q.answered) return; const v = el.dataset.v === '1'; this.answer(ITEMS[q.key].item.a === v, { pick: v }); },
        'pick-line'(el) { const q = this.run().q; if (q.answered) return; q.sel = +el.dataset.n; this.renderPane(); },
        piece(el) { const q = this.run().q; if (q.answered) return; q.placed.push(+el.dataset.i); this.renderPane(); },
        unplace(el) { const q = this.run().q; if (q.answered) return; q.placed.splice(+el.dataset.n, 1); this.renderPane(); },
        'order-reset'() { const q = this.run().q; q.placed = []; this.renderPane(); },
        next() { this.next(); },
        again() { const m = this.mode(); this.startPractice(m.type); this.renderPane(true); this.renderStatus(); this.scrollPaneIntoView(); },
        'retry-wrong'() {
          const r = this.run(), wrong = r.results.filter(x => !x.correct).map(x => x.key);
          this.startPractice(r.type, wrong, 'retry');
          this.renderPane(true); this.renderStatus(); this.scrollPaneIntoView();
        },

        'exam-scope'(el) { Store.d.scope.exam = el.dataset.scope; Store.save(); this.renderPane(); },
        'exam-start'() { this.startExam(); this.scrollPaneIntoView(); },
        'exam-new'() { delete this.runs.exam; this.renderPane(true); this.renderStatus(); },

        'rapid-scope'(el) { Store.d.scope.rapid = el.dataset.scope; Store.save(); this.renderPane(); },
        'rapid-start'() { this.startRapid(); this.scrollPaneIntoView(); },
        'rapid-reset'() { delete this.runs.rapid; this.renderPane(true); this.renderStatus(); },
        'rapid-ans'(el) { this.rapidAnswer(el.dataset.v === '1'); },

        copy(el) { this.copy(el.dataset.src, el); },
        'goto-lesson'(el) {
          const id = el.dataset.ch, t = TRACKS.find(tr => tr.chapters.some(c => c.id === id));
          Store.d.track = t.id;
          Store.d.chapter[t.id] = id;
          Store.d.mode = 'learn';
          this.resetRuns();
          this.learnI = +el.dataset.i;
          Store.d.learnPos[id] = this.learnI;
          Store.save();
          this.renderAll(true);
          this.scrollPaneIntoView();
        },

        settings() { this.openSettings(); },
        notice() { this.openAbout(); },
        install() { this.openInstall(); },
        'install-os'(el) { this.openInstall(el.dataset.os); },
        async 'install-now'() {
          if (!this.installPrompt) return;
          this.installPrompt.prompt();
          try { await this.installPrompt.userChoice; } catch (e) {}
          this.installPrompt = null;
          this.closeSheet();
        },
        theme() {
          Store.d.settings.theme = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
          Store.save();
          this.applyTheme();
          this.openSettings(true);
        },
        'set-toggle'(el) { const k = el.dataset.key; Store.d.settings[k] = !Store.d.settings[k]; Store.save(); el.classList.toggle('on', Store.d.settings[k]); },
        'check-update'(el) { this.checkUpdate(el); },
        async 'do-update'() {
          try { const reg = await navigator.serviceWorker.getRegistration(); if (reg) await reg.update(); } catch (e) {}
          location.reload();
        },
        export() { this.exportProgress(); },
        import() { $('#import-file').click(); },
        'reset-all'() {
          if (!confirm('Reset all progress? This clears lessons, scores, exams and your streak.')) return;
          const keep = Store.d.settings;
          localStorage.removeItem(STORE_KEY);
          Store.load();
          Store.d.settings = keep;
          Store.save();
          this.resetRuns();
          this.learnI = 0;
          this.closeSheet();
          this.renderAll(true);
          this.toast('Progress reset');
        },
        'close-sheet'() { this.closeSheet(); },
      },

      /* ---------- Sheets ---------- */
      openSheet(html, still) {
        $('#overlay').classList.toggle('still', !!still);
        $('#overlay').innerHTML = `<div class="backdrop" data-action="close-sheet"></div><div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
        document.body.classList.add('locked');
      },
      closeSheet() { $('#overlay').innerHTML = ''; document.body.classList.remove('locked'); },
      sheetHead(title) { return `<div class="sheet-head"><h3>${title}</h3><button class="icon-btn" data-action="close-sheet" aria-label="Close">${icon('x')}</button></div>`; },

      openChapters() {
        const t = this.track(), cur = this.ch();
        this.openSheet(`${this.sheetHead(`${t.n} · ${esc(t.name)}`)}
          <div class="sheet-body"><div class="ch-list">${t.chapters.map(c => {
            const p = this.progress(c), passed = (Store.d.exams[c.id] || 0) >= PASS;
            return `<button class="ch-row ${c.id === cur.id ? 'cur' : ''}" data-action="chapter" data-id="${c.id}">
              <span class="idx">In [${c.idx + 1}]</span>
              <span><b>${esc(c.title)}</b><small>${md(c.blurb)}</small><span class="bar"><i style="width:${pct(p)}%"></i></span></span>
              <span class="pv">${pct(p)}%${passed ? '<span class="pass">passed</span>' : ''}</span>
            </button>`;
          }).join('')}</div></div>`);
        const c = $('.ch-row.cur');
        if (c) c.scrollIntoView({ block: 'nearest' });
      },
      openAbout() {
        const nQ = Object.keys(ITEMS).length, nCh = TRACKS.reduce((s, t) => s + t.chapters.length, 0);
        this.openSheet(`${this.sheetHead('About glitch.ml')}
          <div class="sheet-body">
            <p>Learn to write machine-learning code in small steps: read a short lesson, then test yourself seven different ways.</p>
            <div class="about-stats">
              <div><b>${TRACKS.length}</b><span>tracks</span></div>
              <div><b>${nCh}</b><span>chapters</span></div>
              <div><b>${nQ}</b><span>questions</span></div>
            </div>
            <ul class="about-list">${TRACKS.map(t => `<li><b>${t.n} ${esc(t.name)}</b> · ${t.chapters.map(c => esc(c.title)).join(', ')}</li>`).join('')}</ul>
            <p class="small muted">Lessons and questions were written with AI. The code follows NumPy, pandas 2, scikit-learn 1.4+ and PyTorch 2. If something looks off, the library's own docs win.</p>
            <p class="small muted" style="margin-top:8px">Want to run the code for real? <a href="https://colab.research.google.com/" target="_blank" rel="noopener">Google Colab</a> runs Python with all of these libraries in your browser for free.</p>
            <p class="small muted" style="margin-top:8px">Your progress is saved on this device only. Use Settings → Back up to move it.</p>
            <p style="margin-top:14px;font-size:0.7rem;color:var(--text-3);opacity:0.5">Made by Ahmed Hashash</p>
          </div>`);
      },
      openSettings(still) {
        const st = Store.d.settings, light = document.documentElement.dataset.theme === 'light';
        const learned = Object.values(Store.d.items).filter(v => v === 1).length;
        const passed = Object.values(Store.d.exams).filter(v => v >= PASS).length;
        this.openSheet(`${this.sheetHead('Settings')}
          <div class="sheet-body">
            <div class="set-row"><div class="lbl"><b>Add to Home Screen</b><span>${this.isStandalone() ? 'Installed ✓. Open the guide to help someone else' : 'Use it like an app, even offline'}</span></div>
              <button class="btn btn-sm ${this.isStandalone() ? '' : 'btn-primary'}" data-action="install">${this.isStandalone() ? 'Open guide' : 'Show me how'}</button></div>
            <div class="set-row"><div class="lbl"><b>Appearance</b><span>${light ? 'Light' : 'Dark'} mode</span></div>
              <button class="btn btn-sm" data-action="theme">${icon(light ? 'moon' : 'sun')} Switch to ${light ? 'dark' : 'light'}</button></div>
            <div class="set-row"><div class="lbl"><b>Shuffle practice questions</b><span>Mix up the order in each practice mode</span></div>
              <button class="toggle ${st.shuffle ? 'on' : ''}" data-action="set-toggle" data-key="shuffle" aria-label="Shuffle practice questions"></button></div>
            <div class="set-row"><div class="lbl"><b>App version ${APP_VERSION}</b><span id="update-status">Updates install automatically when you're online</span></div>
              <button class="btn btn-sm" data-action="check-update">Check for updates</button></div>
            <div class="set-row"><div class="lbl"><b>Works offline</b><span id="offline-status">Checking…</span></div><span id="offline-dot" class="sdot"></span></div>
            <div class="set-row"><div class="lbl"><b>Your progress</b><span>${learned} questions right · ${passed} chapter exam${passed === 1 ? '' : 's'} passed · ${Store.liveStreak()}-day streak</span></div></div>
            <div class="set-row"><div class="lbl"><b>Back up progress</b><span>Save a file, or restore from one on another device</span></div>
              <div class="btn-row"><button class="btn btn-sm" data-action="export">Export</button><button class="btn btn-sm" data-action="import">Import</button></div></div>
            <div class="set-row"><div class="lbl"><b>Reset everything</b><span>Clears lessons, scores, exams and streak</span></div>
              <button class="btn btn-sm btn-bad" data-action="reset-all">Reset</button></div>
            <input type="file" id="import-file" accept="application/json,.json" hidden>
          </div>`, still);
        $('#import-file').addEventListener('change', e => this.importProgress(e.target.files[0]));
        this.checkOffline();
      },

      isStandalone() { return window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches; },
      renderInstallBtn() {
        const b = $('#install-btn');
        if (!b) return;
        if (this.isStandalone()) return b.remove();
        b.innerHTML = icon('phone') + (Store.d.seenInstall ? '' : '<span class="nd"></span>');
      },
      openInstall(os) {
        if (!Store.d.seenInstall) { Store.d.seenInstall = true; Store.save(); this.renderInstallBtn(); }
        const ua = navigator.userAgent;
        const isIOS = /iphone|ipad|ipod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
        os = os || (isIOS ? 'ios' : 'android');
        const g = n => `<span class="glyph">${icon(n)}</span>`;
        const li = (n, html) => `<li><span class="num">${n}</span><span>${html}</span></li>`;
        const body = os === 'ios' ? `
            <ol class="inst-list">
              ${li(1, `Open this page in <b>Safari</b>.`)}
              ${li(2, `Tap the menu button ${g('more')} next to the address bar, then <b>Share</b> ${g('share')}. On older iPhones, Share ${g('share')} sits right in the bottom bar.`)}
              ${li(3, `Scroll down and tap <b>Add to Home Screen</b> ${g('plusSq')}. Not there? Tap <b>Edit Actions</b> at the bottom to add it.`)}
              ${li(4, `Keep <b>Open as Web App</b> on and tap <b>Add</b>.`)}
              ${li(5, `Open <b>glitch.ml</b> from its new icon. In Settings, <b>Works offline</b> turns green once it's ready.`)}
            </ol>
            <div class="inst-note">Always open it from the icon. Progress is saved separately in the app and in Safari.</div>`
          : `
            ${this.installPrompt ? `<button class="btn btn-primary btn-lg" style="width:100%;margin-bottom:6px" data-action="install-now">${icon('phone')} Install now</button>` : ''}
            <div class="inst-sub">Chrome</div>
            <ol class="inst-list">
              ${li(1, `Tap the menu ${g('dots')} at the top right.`)}
              ${li(2, `Tap <b>Add to Home screen</b> (or <b>Install app</b>), then <b>Install</b>.`)}
            </ol>
            <div class="inst-sub">Samsung Internet</div>
            <ol class="inst-list">
              ${li(1, `Tap the menu ${g('menu')} at the bottom right.`)}
              ${li(2, `Tap <b>Add page to</b> → <b>Home screen</b>, then <b>Add</b>.`)}
            </ol>
            <div class="inst-note">Always open it from the icon. Progress is saved separately in the app and in the browser.</div>`;
        this.openSheet(`${this.sheetHead('Add to Home Screen')}
          <div class="sheet-body">
            <p>Install glitch.ml like a real app: its own icon, full screen, and it works without internet.</p>
            <div style="margin-bottom:12px"><div class="seg">
              <button class="${os === 'ios' ? 'on' : ''}" data-action="install-os" data-os="ios">iPhone / iPad</button>
              <button class="${os === 'android' ? 'on' : ''}" data-action="install-os" data-os="android">Android</button>
            </div></div>
            ${body}
          </div>`);
      },

      // Reads the version number of the copy on the website (null when offline).
      async remoteVersion() {
        try {
          const t = await (await fetch('./index.html?v=' + Date.now(), { cache: 'no-store' })).text();
          const m = t.match(/const APP_VERSION = (\d+);/);
          return m ? +m[1] : null;
        } catch (e) { return null; }
      },
      async checkUpdate(btn) {
        const st = $('#update-status');
        btn.disabled = true; btn.textContent = 'Checking…';
        const v = await this.remoteVersion();
        btn.disabled = false; btn.textContent = 'Check for updates';
        if (v == null) { if (st) st.textContent = 'Could not check. Are you online?'; return; }
        if (v > APP_VERSION) {
          if (st) st.textContent = 'Updating to version ' + v + '…';
          try { const reg = await navigator.serviceWorker.getRegistration(); if (reg) await reg.update(); } catch (e) {}
          return location.reload();
        }
        if (st) st.textContent = "You're up to date ✓";
      },
      showUpdateBar() {
        if ($('.update-bar')) return;
        const bar = document.createElement('div');
        bar.className = 'update-bar';
        bar.innerHTML = '<span>A new version is ready</span><button data-action="do-update">Update</button>';
        document.body.appendChild(bar);
      },
      async checkOffline() {
        const set = (ok, msg) => { const t = $('#offline-status'), d = $('#offline-dot'); if (!t) return; t.textContent = msg; d.style.background = ok ? 'var(--ok)' : 'var(--bad)'; };
        if (!('serviceWorker' in navigator) || location.protocol !== 'https:') return set(false, 'Only works from the web link');
        try {
          const reg = await navigator.serviceWorker.getRegistration();
          const keys = window.caches ? await caches.keys() : [];
          if (reg && reg.active && keys.length) set(true, 'Ready: you can use it without internet');
          else set(false, 'Not ready yet. Keep it open with internet for a few seconds');
        } catch (e) { set(false, 'Not available in this browser mode'); }
      },

      exportProgress() {
        const blob = new Blob([JSON.stringify(Store.d, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `glitch-ml-progress-${dayKey()}.json`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
      },
      importProgress(file) {
        if (!file) return;
        const rd = new FileReader();
        rd.onload = () => {
          try {
            const d = JSON.parse(rd.result);
            if (!d || typeof d !== 'object' || !d.items) throw new Error('bad file');
            localStorage.setItem(STORE_KEY, JSON.stringify(d));
            Store.load();
            this.resetRuns();
            this.learnI = Store.d.learnPos[this.ch().id] || 0;
            this.applyTheme();
            this.closeSheet();
            this.renderAll(true);
            this.toast('Progress restored');
          } catch (e) { this.toast("That file isn't a glitch.ml backup"); }
        };
        rd.readAsText(file);
      },

      /* ---------- small things ---------- */
      applyTheme() {
        const t = Store.d.settings.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = t;
        const meta = $('meta[name="theme-color"]');
        if (meta) meta.content = t === 'light' ? '#f5f4fb' : '#0a0a12';
      },
      toast(msg) {
        const old = $('.toast'); if (old) old.remove();
        const t = document.createElement('div');
        t.className = 'toast';
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2200);
      },
      shake(el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); },
      async copy(text, btn) {
        try { await navigator.clipboard.writeText(text); }
        catch (e) {
          const ta = document.createElement('textarea');
          ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.appendChild(ta); ta.select();
          try { document.execCommand('copy'); } catch (e2) {}
          ta.remove();
        }
        const s = btn.querySelector('span');
        btn.classList.add('done'); if (s) s.textContent = 'copied';
        setTimeout(() => { btn.classList.remove('done'); if (s) s.textContent = 'copy'; }, 1400);
      },
    };

    document.addEventListener('DOMContentLoaded', () => app.init());

    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); app.installPrompt = e; });
    window.addEventListener('appinstalled', () => { app.installPrompt = null; app.renderInstallBtn(); });

    // Offline support + updates (only works when served over https, e.g. GitHub Pages)
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', () => {
        const firstInstall = !navigator.serviceWorker.controller;
        // iPhone keeps home-screen apps suspended instead of reloading them,
        // so look for a newer version every time the app comes back on screen.
        const lookForUpdate = async () => {
          const v = await app.remoteVersion();
          if (v && v > APP_VERSION) {
            navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {});
            app.showUpdateBar();
          }
        };
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') lookForUpdate(); });
        setTimeout(lookForUpdate, 3000);
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
          const done = () => { if (firstInstall) app.toast('Ready to use offline'); };
          if (reg.active && !reg.installing) return;
          const w = reg.installing || reg.waiting;
          if (w) w.addEventListener('statechange', () => { if (w.state === 'activated') done(); });
        }).catch(() => {});
        // Ask the browser not to clear saved progress
        if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
      });
    }
  </script>
</body>
</html>
